[analysis]
exclude = [
  "**/Generated/**",
  "**/*.g.cs",
  "**/*.generated.cs",
]
test_projects = [
  "**/tests/**",
]

[thresholds]
max_dependencies = 20
max_dependents = 30
min_temporal_coupling = 3
max_temporal_files_per_commit = 50
scattered_external_breadth = 5

[ignore]
paths = [
  "**/Legacy/**",
]
namespaces = [
  "Sample.Legacy",
]
issue_types = [
  "ScatteredExternalCoupling",
]

[[ignore.issues]]
type = "GlobalComplexity"
source = "Sample.App.Api.LegacyHandler"
target = "Sample.App.Infrastructure.LegacyRepository"
reason = "Accepted legacy dependency tracked in ARCH-42"

[[domain.subdomains]]
name = "Billing"
category = "core"
paths = ["src/Sample.App.Billing/**"]
expected_volatility = "high"

[[domain.subdomains]]
name = "Reporting"
category = "supporting"
paths = ["src/Sample.App.Reporting/**"]
expected_volatility = "low"

[[domain.subdomains]]
name = "SharedKernel"
category = "supporting"
paths = ["src/Sample.App.SharedKernel/**"]
expected_volatility = "low"
strategic_role = "shared_kernel"

[[domain.areas]]
name = "BillingDomain"
paths = ["src/Sample.App.Billing/Domain/**"]
technical_role = "domain_model"

[[domain.areas]]
name = "BillingApplication"
paths = ["src/Sample.App.Billing/Application/**"]
technical_role = "application_service"

[[domain.areas]]
name = "InfrastructureAdapters"
paths = ["src/Sample.App.Infrastructure/**"]
technical_role = "adapter"

[[domain.areas]]
name = "HostCompositionRoot"
paths = ["src/Sample.App.Web/Program.cs", "src/Sample.App.Web/Startup.cs"]
technical_role = "composition_root"
