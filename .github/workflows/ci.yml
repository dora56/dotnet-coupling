name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      docs_only: ${{ steps.changed-files.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          if [[ -z "$changed_files" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          non_docs_files="$(
            printf '%s\n' "$changed_files" |
              grep -Ev '^(docs/|\.agents/|README\.md|AGENTS\.md|LICENSE$|[^/]+\.md$)' || true
          )"

          if [[ -z "$non_docs_files" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-slim
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache .NET dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/toolResolverCache
          key: dotnet-${{ runner.os }}-${{ hashFiles('dotnet-coupling.slnx', '**/*.csproj', '**/packages.lock.json', 'Directory.Build.*', '.config/dotnet-tools.json') }}
          restore-keys: |
            dotnet-${{ runner.os }}-

      - name: Restore
        run: dotnet restore dotnet-coupling.slnx --locked-mode

      - name: Build
        run: dotnet build dotnet-coupling.slnx --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/DotnetCoupling.Cli/DotnetCoupling.Cli.csproj --configuration Release --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            src/**/bin/Release/**
            src/**/obj/Release/**
            tests/**/bin/Release/**
            tests/**/obj/Release/**
            src/DotnetCoupling.Cli/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: ubuntu-slim
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache .NET dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/toolResolverCache
          key: dotnet-${{ runner.os }}-${{ hashFiles('dotnet-coupling.slnx', '**/*.csproj', '**/packages.lock.json', 'Directory.Build.*', '.config/dotnet-tools.json') }}
          restore-keys: |
            dotnet-${{ runner.os }}-

      - name: Restore
        run: dotnet restore dotnet-coupling.slnx --locked-mode

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: Restore executable bits
        shell: bash
        run: |
          find tests -type f -path '*/bin/Release/*' -exec chmod +x {} +

      - name: Test
        run: dotnet test dotnet-coupling.slnx --configuration Release --no-restore --no-build --results-directory TestResults/Coverage --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: Stage coverage report
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/coverage
          mapfile -t coverage_reports < <(find . -type f \
            \( -name 'coverage.cobertura.xml' -o -name 'coverage.cobertura*.xml' -o -name '*.coverage.cobertura.xml' -o -name '*.coverage.cobertura*.xml' \) \
            -not -path './artifacts/coverage/*' | sort)

          if [[ "${#coverage_reports[@]}" -ne 1 ]]; then
            echo "Expected exactly one coverage report, found ${#coverage_reports[@]}." >&2
            exit 1
          fi

          cp "${coverage_reports[0]}" artifacts/coverage/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 14

  format:
    runs-on: ubuntu-slim
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache .NET dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/toolResolverCache
          key: dotnet-${{ runner.os }}-${{ hashFiles('dotnet-coupling.slnx', '**/*.csproj', '**/packages.lock.json', 'Directory.Build.*', '.config/dotnet-tools.json') }}
          restore-keys: |
            dotnet-${{ runner.os }}-

      - name: Restore
        run: dotnet restore dotnet-coupling.slnx --locked-mode

      - name: Format
        run: dotnet format dotnet-coupling.slnx --verify-no-changes --no-restore

  self-benchmark:
    runs-on: ubuntu-slim
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: Read package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Install local tool
        run: |
          TOOL_PATH="$(mktemp -d)"
          echo "TOOL_PATH=$TOOL_PATH" >> "$GITHUB_ENV"
          dotnet tool install dotnet-coupling --tool-path "$TOOL_PATH" --add-source src/DotnetCoupling.Cli/nupkg --version "$PACKAGE_VERSION"

      - name: Self-benchmark
        run: |
          "$TOOL_PATH/dotnet-coupling" --check --min-grade A --no-git ./src

      - name: Semantic self baseline gate
        run: |
          mkdir -p artifacts/semantic-self
          "$TOOL_PATH/dotnet-coupling" --json --output artifacts/semantic-self/semantic-self-report.json --check --baseline origin/main --fail-on High --config .coupling.toml --mode semantic dotnet-coupling.slnx
          grade="$(jq -r '.grade.letter' artifacts/semantic-self/semantic-self-report.json)"
          case "$grade" in
            C|B|A|S) ;;
            *) echo "Semantic self grade $grade is below C." >&2; exit 1 ;;
          esac
          "$TOOL_PATH/dotnet-coupling" --summary --config .coupling.toml --mode semantic dotnet-coupling.slnx > artifacts/semantic-self/semantic-self-summary.txt

      - name: Upload semantic self report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-self-report
          path: artifacts/semantic-self
          if-no-files-found: error
          retention-days: 14

  coupling-feedback:
    runs-on: ubuntu-slim
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: Read package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Install local tool
        run: |
          TOOL_PATH="$(mktemp -d)"
          echo "TOOL_PATH=$TOOL_PATH" >> "$GITHUB_ENV"
          dotnet tool install dotnet-coupling --tool-path "$TOOL_PATH" --add-source src/DotnetCoupling.Cli/nupkg --version "$PACKAGE_VERSION"

      - name: Generate coupling SARIF
        run: |
          "$TOOL_PATH/dotnet-coupling" --sarif --output dotnet-coupling.sarif --no-git ./src

      - name: Generate coupling hotspots
        run: |
          "$TOOL_PATH/dotnet-coupling" --hotspots 10 --no-git ./src | tee dotnet-coupling-hotspots.txt

      - name: Upload SARIF to Code Scanning
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: dotnet-coupling.sarif

      - name: Upload coupling SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coupling-sarif
          path: dotnet-coupling.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload coupling hotspots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coupling-hotspots
          path: dotnet-coupling-hotspots.txt
          if-no-files-found: error
          retention-days: 14

  report:
    runs-on: ubuntu-slim
    needs:
      - changes
      - test
      - self-benchmark
      - coupling-feedback
    if: always() && needs.changes.outputs.docs_only != 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-report
          path: artifacts/coverage

      - name: Download semantic self report
        if: needs.self-benchmark.result != 'skipped' && needs.self-benchmark.result != 'cancelled'
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: semantic-self-report
          path: artifacts/semantic-self

      - name: Download coupling SARIF artifact
        if: needs.coupling-feedback.result != 'skipped' && needs.coupling-feedback.result != 'cancelled'
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: dotnet-coupling-sarif
          path: artifacts/coupling/sarif

      - name: Download coupling hotspots artifact
        if: needs.coupling-feedback.result != 'skipped' && needs.coupling-feedback.result != 'cancelled'
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: dotnet-coupling-hotspots
          path: artifacts/coupling/hotspots

      - name: Generate branch coverage metric
        run: python3 scripts/generate-branch-coverage-metric.py --coverage artifacts/coverage/coverage.xml --output artifacts/coverage/branch-coverage.json

      - name: Report coverage with octocov
        if: always()
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1
        with:
          version: v0.75.9
        env:
          OCTOCOV_CUSTOM_METRICS_BRANCH_COVERAGE: artifacts/coverage/branch-coverage.json
          OCTOCOV_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Generate CI summary
        if: always()
        shell: bash
        run: |
          scripts/generate-ci-summary.sh \
            --mutation-dir artifacts/mutation \
            --coupling-dir artifacts/coupling \
            --semantic-dir artifacts/semantic-self \
            | tee ci-summary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- dotnet-coupling-ci-report -->';
            const body = fs.readFileSync('ci-summary.md', 'utf8');
            const commentBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            try {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: commentBody,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Skipping PR comment because GitHub denied comment access: ${error.message}`);
              } else {
                throw error;
              }
            }
