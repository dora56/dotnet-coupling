name: nightly-mutation

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation (${{ matrix.name }})
    runs-on: ubuntu-slim
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            config: stryker-config.json
          - name: complexity
            config: stryker-complexity-config.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache .NET dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/toolResolverCache
          key: dotnet-${{ runner.os }}-${{ hashFiles('dotnet-coupling.slnx', '**/*.csproj', '**/packages.lock.json', 'Directory.Build.*', '.config/dotnet-tools.json') }}
          restore-keys: |
            dotnet-${{ runner.os }}-

      - name: Restore
        run: dotnet restore dotnet-coupling.slnx --locked-mode

      - name: Restore tools
        run: dotnet tool restore

      - name: Mutation test
        run: dotnet tool run dotnet-stryker -- --config-file "${{ matrix.config }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: StrykerOutput/**
          if-no-files-found: warn
          retention-days: 14
