[analysis]
exclude = [
  "**/bin/**",
  "**/obj/**",
  "**/*.g.cs",
  "**/*.generated.cs",
  "tests/fixtures/**",
]
test_projects = [
  "**/tests/DotnetCoupling.Tests/**",
]

[thresholds]
max_dependencies = 20
max_dependents = 30
min_temporal_coupling = 3
max_temporal_files_per_commit = 50
scattered_external_breadth = 5

[prioritization]
cyclomatic_complexity_threshold = 10
cognitive_complexity_threshold = 15
complexity_weight = 0.10

[ignore]
issue_types = [
  "ScatteredExternalCoupling",
]

[[domain.subdomains]]
name = "CoreRules"
category = "core"
paths = ["src/DotnetCoupling.Core/Domain/**"]
expected_volatility = "high"

