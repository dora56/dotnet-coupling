[analysis]
exclude = [
  "**/bin/**",
  "**/obj/**",
  "**/*.g.cs",
  "**/*.generated.cs",
  "tests/fixtures/**",
]
test_projects = [
  "**/tests/DotnetCoupling.Tests/**",
]

[thresholds]
max_dependencies = 20
max_dependents = 30
min_temporal_coupling = 3
max_temporal_files_per_commit = 50
scattered_external_breadth = 5

[ignore]
issue_types = [
  "ScatteredExternalCoupling",
]

[[domain.subdomains]]
name = "CoreRules"
category = "core"
paths = [
  "src/DotnetCoupling.Core/CouplingCalibrator.cs",
  "src/DotnetCoupling.Core/CouplingResolver.cs",
  "src/DotnetCoupling.Core/CouplingScoring.cs",
  "src/DotnetCoupling.Core/ExternalCouplingDetector.cs",
  "src/DotnetCoupling.Core/HotspotAnalyzer.cs",
  "src/DotnetCoupling.Core/IssueDetector.cs",
]
expected_volatility = "high"

[[domain.subdomains]]
name = "CoreContracts"
category = "supporting"
paths = [
  "src/DotnetCoupling.Core/Models.cs",
  "src/DotnetCoupling.Core/VolatilityAnalysis.cs",
]
expected_volatility = "medium"

[[domain.subdomains]]
name = "CoreConfig"
category = "supporting"
paths = [
  "src/DotnetCoupling.Core/Configuration*.cs",
  "src/DotnetCoupling.Core/JsonConfigurationReader.cs",
  "src/DotnetCoupling.Core/RawConfiguration.cs",
  "src/DotnetCoupling.Core/TomlConfigurationReader.cs",
]
expected_volatility = "medium"

[[domain.subdomains]]
name = "CoreReporting"
category = "supporting"
paths = ["src/DotnetCoupling.Core/ReportRenderer.cs"]
expected_volatility = "medium"

[[domain.subdomains]]
name = "CoreUtilities"
category = "generic"
paths = [
  "src/DotnetCoupling.Core/DomainContextMatcher.cs",
  "src/DotnetCoupling.Core/PathPatternMatcher.cs",
]
expected_volatility = "low"

[[domain.subdomains]]
name = "Roslyn"
category = "supporting"
paths = ["src/DotnetCoupling.Roslyn/**"]
expected_volatility = "medium"

[[domain.subdomains]]
name = "Git"
category = "supporting"
paths = ["src/DotnetCoupling.Git/**"]
expected_volatility = "low"

[[domain.subdomains]]
name = "Sarif"
category = "generic"
paths = ["src/DotnetCoupling.Sarif/**"]
expected_volatility = "low"

[[domain.subdomains]]
name = "Cli"
category = "supporting"
paths = ["src/DotnetCoupling.Cli/**"]
expected_volatility = "medium"

[[domain.areas]]
name = "CoreRules"
paths = [
  "src/DotnetCoupling.Core/CouplingCalibrator.cs",
