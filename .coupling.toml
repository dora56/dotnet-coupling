[analysis]
exclude = [
  "**/bin/**",
  "**/obj/**",
  "**/*.g.cs",
  "**/*.generated.cs",
]

[thresholds]
max_dependencies = 20
max_dependents = 30
min_temporal_coupling = 3
max_temporal_files_per_commit = 50
scattered_external_breadth = 5

[ignore]
issue_types = [
  "ScatteredExternalCoupling",
]

[[domain.subdomains]]
name = "Core"
category = "core"
paths = ["src/DotnetCoupling.Core/**"]
expected_volatility = "high"

[[domain.subdomains]]
name = "Roslyn"
category = "supporting"
paths = ["src/DotnetCoupling.Roslyn/**"]
expected_volatility = "medium"

[[domain.subdomains]]
name = "Git"
category = "supporting"
paths = ["src/DotnetCoupling.Git/**"]
expected_volatility = "low"

[[domain.subdomains]]
name = "Sarif"
category = "generic"
paths = ["src/DotnetCoupling.Sarif/**"]
expected_volatility = "low"

[[domain.subdomains]]
name = "Cli"
category = "supporting"
paths = ["src/DotnetCoupling.Cli/**"]
expected_volatility = "medium"
